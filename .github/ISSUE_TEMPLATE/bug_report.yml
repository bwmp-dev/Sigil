name: Bug report
description: Something does not work the way it should
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The single most useful thing you can include is
        the output of `/sigil platform` — Sigil runs on 1.18 through 26.x across
        Spigot, Paper, Purpur and Folia, and picks a different implementation on
        each. Most reports are impossible to place without it.

  - type: textarea
    id: platform
    attributes:
      label: Output of /sigil platform
      description: Run it in console or in game and paste the whole block.
      render: text
      placeholder: |
        --- Platform ---
        Server:   Purpur 26.1.2-2592-405ad83 (MC: 26.1.2)
        Brand:    Purpur
        Version:  26.1.2  [raw: 26.1.2.build.2592-stable]
        Keystone: 0.1.0-SNAPSHOT, relocated=true
        Item tier: latest (1.21.4+)
        Scheduler: Bukkit
        Item model: true, max stack size: true
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        Steps, and the item involved. If it concerns a specific item, the
        contents of its file under `plugins/Sigil/items/<namespace>/` is worth
        more than a description of it.
      placeholder: |
        1. /sigil give sigil:grapple
        2. Right-click at open sky
        3. Nothing happens
    validations:
      required: true

  - type: textarea
    id: startup
    attributes:
      label: Sigil's startup block
      description: |
        The lines Sigil logs on enable, including any `[error]`, `[warn]` or
        `[gate]` entries. A `[gate]` line means a feature was downgraded because
        the server version could not do what was asked, which is often the whole
        explanation.
      render: text

  - type: textarea
    id: plugins
    attributes:
      label: Other plugins
      description: |
        Anything that touches items, inventories, crafting or protection.
        Those are where conflicts actually happen.
